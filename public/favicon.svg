<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cooltrack-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#cooltrack-grad)" />
  
  <!-- Modern Snowflake / HVAC Cooling Icon -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical line -->
    <line x1="32" y1="12" x2="32" y2="52" />
    <!-- Horizontal line -->
    <line x1="12" y1="32" x2="52" y2="32" />
    <!-- Diagonal 1 -->
    <line x1="18" y1="18" x2="46" y2="46" />
    <!-- Diagonal 2 -->
    <line x1="18" y1="46" x2="46" y2="18" />
    
    <!-- Branch accents -->
    <path d="M27 17 L32 12 L37 17" />
    <path d="M27 47 L32 52 L37 47" />
    <path d="M17 27 L12 32 L17 37" />
    <path d="M47 27 L52 32 L47 37" />
    
    <path d="M20 25 L18 18 L25 20" />
    <path d="M44 39 L46 46 L39 44" />
    <path d="M39 20 L46 18 L44 25" />
    <path d="M25 44 L18 46 L20 39" />
  </g>
  <!-- Center Core -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
